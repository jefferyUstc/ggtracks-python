# Read the Docs configuration (https://docs.readthedocs.io/en/stable/config-file/v2.html)
#
# Uses build.commands so the build runs the exact same gate as local
# development and CI: `mkdocs build --strict`.

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  commands:
    - python -m pip install ".[docs]"
    - python -m mkdocs build --strict --site-dir $READTHEDOCS_OUTPUT/html
