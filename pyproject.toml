[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ggtracks-python"
version = "0.2.0"
description = "Grammar-of-graphics genomic tracks for the ggplot2-python ecosystem (Biobabel)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "jeffery liu", email = "jeffliu.lucky@gmail.com" },
]
keywords = [
    "genomics",
    "visualization",
    "ggplot2",
    "tracks",
    "transcript",
    "splicing",
    "grammar-of-graphics",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "numpy",
    "pandas",
    "ggplot2-python",
    "ggh4x-python",
    "ggnewscale-python",
    "patchwork-python",
]

[project.optional-dependencies]
test = ["pytest>=7"]
docs = ["mkdocs", "mkdocs-material", "mkdocstrings[python]"]

[project.urls]
Homepage = "https://github.com/jefferyUstc/ggtracks-python"
Repository = "https://github.com/jefferyUstc/ggtracks-python"
Documentation = "https://jefferyUstc.github.io/ggtracks-python/"

[tool.hatch.build.targets.wheel]
packages = ["ggtracks"]
